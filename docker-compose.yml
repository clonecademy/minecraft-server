services:
  mc:
    image: itzg/minecraft-server:java21
    restart: unless-stopped
    stop_grace_period: 2m   # give the server time to save + shut down cleanly before Docker SIGKILLs it
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"

      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.251"

      # Pins the server to the exact same mod files as the CurseForge client's "PoKéMoN_ Cobbled Stone Version" server
      # instance (addonID:fileID pairs read from that instance's minecraftinstance.json). The image downloads these on
      # startup and re-syncs whenever this list changes, so mod updates are a git commit, not a manual scp/docker cp.
      # CF_API_KEY is a personal CurseForge API key (console.curseforge.com) — set it in Dokploy's environment/secrets
      # UI, not committed here.
      CF_API_KEY: "${CF_API_KEY}"
      CURSEFORGE_FILES: |
        1125437:8216091
        591388:5962249
        351264:8335665
        676721:8763471
        328085:7963363
        419699:8492726
        513688:8222737
        1581408:8935459
        936015:8944659
        429235:7524151
        570354:7078265
        1091339:8943912
        1510451:8057041
        687131:8868914
        1312371:8673825
        790626:8774737
        398521:8765184
        60028:7901588
        961988:6179576
        841262:7939973

      MEMORY: "16G"       # leaves ~8G of the VM's 24G for Dokploy, the OS, and the MySQL/HeatWave workload
      USE_AIKAR_FLAGS: "true"

      DIFFICULTY: "normal"
      MOTD: "Cobblemon + Create + Aeronautics"
      ONLINE_MODE: "TRUE"        # keep TRUE unless you specifically need cracked-client support
      ALLOW_FLIGHT: "TRUE"       # Create Aeronautics vehicles need this
      ENABLE_WHITELIST: "TRUE"   # private server; add players with rcon `whitelist add <name>` or mount whitelist.json

      MAX_TICK_TIME: "60000"          # don't let the watchdog kill the server during long chunk-gen/lag spikes
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"        # heaviest lever against Cobblemon/Create entity + tile-entity tick load

      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"   # set in Dokploy's environment/secrets UI, not committed

      TZ: "UTC"

    volumes:
      - /opt/minecraft/data:/data

    deploy:
      resources:
        limits:
          memory: 20G   # hard ceiling above the 16G heap for JVM overhead (metaspace, off-heap, native libs); leaves headroom for Dokploy/OS/DB

    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 30s
      retries: 10

  mc-backup:
    image: itzg/mc-backup
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      BACKUP_INTERVAL: "6h"
      RCON_HOST: "mc"
      RCON_PASSWORD: "${RCON_PASSWORD}"   # same secret as the mc service; used to save-off/save-all/save-on around each backup
      PRUNE_BACKUPS_DAYS: "7"             # local retention only — this volume lives on the same boot disk as the world
    volumes:
      - /opt/minecraft/data:/data:ro
      - /opt/minecraft/backups:/backups
